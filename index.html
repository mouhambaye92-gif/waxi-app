<html lang="fr">
<head>
<meta charset="utf-8">

<title>Waxi — Parle dès le 1er jour</title>
<meta name="theme-color" content="#FFF6E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E6; --card:#FFFFFF; --ink:#1D1A16; --muted:#6F675C; --line:#EADFCB;
  --sun:#FFC23D; --sun-d:#E0A21C; --teal:#0F7A62; --teal-d:#0A5A48; --teal-l:#DDF2EA;
  --coral:#F2603F; --coral-d:#C9462A; --coral-l:#FDE5DE; --lock:#D8CDBA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --card:#221E18; --ink:#F6EFE3; --muted:#B3A895; --line:#3A3328;
    --teal-l:#173A31; --coral-l:#40231B; --lock:#4A4234;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --card:#221E18; --ink:#F6EFE3; --muted:#B3A895; --line:#3A3328;
  --teal-l:#173A31; --coral-l:#40231B; --lock:#4A4234;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em;line-height:1.1}
#app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
main{flex:1;padding:16px 16px 110px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;font-weight:700;font-size:16px;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn[disabled]{background:var(--lock);box-shadow:0 4px 0 var(--line);color:var(--muted);cursor:default}
.btn.sun{background:var(--sun);color:#2A1E00;box-shadow:0 4px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:500;padding:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}

.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px}
.chip svg{width:18px;height:18px}
.spacer{flex:1}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:var(--card);border-top:2px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--teal);background:var(--teal-l)}

.ob{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.ob h1{font-size:32px}
.ob p.lead{color:var(--muted)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.opt.on{border-color:var(--teal);background:var(--teal-l);box-shadow:0 3px 0 var(--teal)}
.opt .tag{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;flex:none}
.opt b{display:block}
.opt small{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}

.hello{display:flex;gap:12px;align-items:center;margin:6px 0 18px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:500}
.goal{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.ring{width:62px;height:62px;flex:none}
.unit{margin:8px 0 6px;padding:14px 16px;border-radius:20px;color:#fff;display:flex;align-items:center;gap:12px}
.unit h3{font-size:19px}
.unit small{opacity:.85}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0 18px}
.node{width:74px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.node svg{width:32px;height:32px}
.node.lock{background:var(--lock)!important;box-shadow:0 6px 0 var(--line)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid currentColor;opacity:.35}
.node-label{font-size:12px;font-weight:700;color:var(--muted);margin-top:-6px}

.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.ltitle{font-size:24px;margin:10px 0 16px}
.prompt{display:flex;gap:12px;align-items:flex-end;margin-bottom:20px}
.prompt .bubble{font-size:18px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.choice{padding:14px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:left;font-weight:500;font-size:17px}
.choice.on{border-color:var(--teal);background:var(--teal-l);box-shadow:0 3px 0 var(--teal)}
.choice.done{opacity:.35;pointer-events:none}
.choice.bad{border-color:var(--coral);background:var(--coral-l);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.word{padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:500;font-size:17px}
.word.used{visibility:hidden}
.speaker{width:84px;height:84px;border-radius:24px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--teal-d);margin:6px 0 22px}
.speaker svg{width:40px;height:40px}
.speaker.slow{width:56px;height:56px;border-radius:18px;background:var(--sun);color:#2A1E00;box-shadow:0 4px 0 var(--sun-d)}
.speaker.slow svg{width:26px;height:26px}
.mic{width:110px;height:110px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;margin:18px auto 10px;box-shadow:0 6px 0 var(--coral-d)}
.mic svg{width:46px;height:46px}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--coral-d),0 0 0 14px rgba(242,96,63,.18)}}
.heard{text-align:center;color:var(--muted);min-height:24px}
.target{font-size:26px;font-weight:700;text-align:center;margin:4px 0 2px}
.sub{text-align:center;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.type{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px}

.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line);z-index:10}
.foot.right{background:var(--teal-l);border-color:transparent}
.foot.wrong{background:var(--coral-l);border-color:transparent}
.fb{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700}
.foot.right .fb{color:var(--teal)}
.foot.wrong .fb{color:var(--coral)}
.fb span{font-weight:500;color:var(--ink);display:block}

.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:30px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.stat{border-radius:16px;border:2px solid;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-family:"Bricolage Grotesque"}
.stat small{font-weight:700;font-size:12px}

.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.msg.me{align-self:flex-end;background:var(--teal);border-color:var(--teal);color:#fff;border-bottom-right-radius:6px}
.msg.bot{border-bottom-left-radius:6px;align-self:flex-start}
.msg .tr{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.msg .act{display:flex;gap:12px;margin-top:6px;font-size:13px;font-weight:700;color:var(--teal)}
.reply{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;padding:12px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line);z-index:9}
.reply .card{display:flex;align-items:center;gap:12px}
.mini-mic{width:54px;height:54px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--coral-d)}
.mini-mic svg{width:26px;height:26px}
.mini-mic.rec{animation:pulse 1s infinite}

.timer{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:22px}
.timer i{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.big{font-size:34px;text-align:center;margin:10px 0 24px}
.combo{color:var(--coral);font-weight:800}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.row:last-child{border:0}
.row b{flex:1}
.sec-t{font-size:20px;margin:22px 0 10px}
.note{font-size:14px;color:var(--muted)}
select.sel{font:inherit;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:55%}
.lvl{font-size:15px;color:var(--muted);text-align:center;margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.lvl::before,.lvl::after{content:"";flex:1;height:2px;background:var(--line)}
.tipbtn{background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.35)}
.review{display:flex;align-items:center;gap:12px;margin-bottom:18px;border-color:var(--sun)}
.tip{font-size:17px;line-height:1.6;border-color:var(--teal);background:var(--teal-l)}
.tip b{color:var(--teal)}
.said{font-size:20px;font-weight:700;text-align:center;margin:12px 0 4px;line-height:1.5}
.said .ok{color:var(--teal)}
.said .ko{color:var(--coral);text-decoration:underline wavy;text-underline-offset:4px}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-160%);width:calc(100% - 32px);max-width:428px;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;z-index:50;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
#toast span{flex:1}
#toast button{font-weight:700;color:var(--sun);padding:4px 6px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>

const norm = s => s.toLowerCase().replace(/[’‘]/g,"'").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const words = s => s.replace(/[?!.,¿¡]/g,"").split(/\s+/).filter(Boolean);

const NUMW = new Set("zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen twenty thirty forty fifty hundred um dois tres quatro cinco seis sete oito nove dez doze uno dos cuatro siete ocho nueve diez doce".split(" "));
const tokMatch = (x,t) => x===t || (t.length>3 && x.startsWith(t.slice(0,-1)));
// Pour chaque mot de la phrase cible : a-t-il été entendu ?
function wordHits(heard, target){
  const h = norm(heard).split(" ").filter(x=>x && !/^\d+$/.test(x)); const used = new Set();
  return words(target).map(w=>{
    const toks = norm(w).split(" ").filter(Boolean);
    const ok = toks.every(t=>{ if(NUMW.has(t)) return true; const i=h.findIndex((x,k)=>!used.has(k)&&tokMatch(x,t)); if(i>-1){used.add(i); return true;} return false; });
    return {w, ok};
  });
}
function similarity(heard, target){ const r=wordHits(heard,target); return r.length ? r.filter(x=>x.ok).length/r.length : 1; }

}

const HAS_TTS = "speechSynthesis" in window;
const voicesReady = new Promise(res=>{
  if(!HAS_TTS) return res();
  if(speechSynthesis.getVoices().length) return res();
  speechSynthesis.addEventListener("voiceschanged", ()=>res(), {once:true});
  setTimeout(res, 1500);
});
// Choisit la meilleure voix pour la langue : voix « Natural » / « Online » / Google d'abord.
function bestVoice(code){
  if(!HAS_TTS) return null;
  const base = code.slice(0,2).toLowerCase();
  const all = speechSynthesis.getVoices().filter(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith(base));
  const exact = all.filter(v=>v.lang.replace("_","-").toLowerCase()===code.toLowerCase());
  const rank = v => /natural|online|google/i.test(v.name) ? 0 : 1;
  return (exact.length?exact:all).sort((a,b)=>rank(a)-rank(b))[0] || null;
}
let ttsOk = false, lastUtter = null;
const warned = {};
function warnTts(kind){
  if(warned[kind+S.lang]) return; warned[kind+S.lang]=1;
  const name = lang().name.split(" ")[0].toLowerCase();
  toast(kind==="voice"
    ? `Aucune voix ${name} n'est installée sur cet appareil. Ouvre Waxi dans Edge ou Chrome, ou ajoute la voix dans Paramètres Windows › Heure et langue › Voix.`
    : "Le son ne sort pas dans ce navigateur. Ouvre Waxi dans Chrome ou Edge et vérifie le volume.");
}
/* ---- Voix enregistrées (Piper, voix neuronale) : audio/<langue>/<hash>.mp3 ----
   Plus humaines et plus fortes que la synthèse du navigateur, identiques sur tous les appareils.
   Si un fichier manque, on retombe sur la synthèse vocale du navigateur. */
function fnv1a(str){
  let h = 0x811c9dc5;
  for(const b of new TextEncoder().encode(str)){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8,"0");
}
const player = new Audio();
player.preload = "auto";
let playToken = 0;
function say(text, rate=0.95){
  if(!text) return;
  const token = ++playToken;
  try{ if(HAS_TTS) speechSynthesis.cancel(); }catch(e){}
  player.pause();
  player.src = `audio/${S.lang}/${fnv1a(text)}.mp3`;
  player.playbackRate = rate < 0.8 ? 0.72 : 1;      // bouton « tortue » : plus lent
  player.volume = 1;
  const fallback = () => { if(token===playToken) sayTTS(text, rate); };
  player.onerror = fallback;
  player.play().then(()=>{ ttsOk = true; }).catch(err=>{ if(err && err.name!=="AbortError") fallback(); });
}
async function sayTTS(text, rate=0.95){
  if(!text) return;
  if(!HAS_TTS) return warnTts("silent");
  await voicesReady;
  const v = bestVoice(lang().voice);
  if(!v) warnTts("voice");
  try{ if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.resume(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang().voice; u.rate = rate; if(v) u.voice = v;
  lastUtter = u;                        // garde une référence (bug Chrome : sinon le son peut être coupé)
  let started = false;
  u.onstart = () => { started = true; ttsOk = true; };
  u.onerror = e => { if(e.error!=="interrupted" && e.error!=="canceled") warnTts("silent"); };
  setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ warnTts("silent"); } }, 60); // petit délai après cancel() (bug Chrome)
  setTimeout(()=>{ if(!started && !ttsOk && lastUtter===u) warnTts("silent"); }, 2500);
}
function toast(msg){
  const t = document.getElementById("toast"); if(!t) return;
  t.innerHTML = `<span>${esc(msg)}</span><button onclick="this.parentNode.classList.remove('show')" aria-label="Fermer">OK</button>`;
  t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("show"), 9000);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(onText, onEnd){
  if(!SR){ onEnd && onEnd(false); return; }
  try{ rec && rec.abort(); }catch(e){}
  rec = new SR(); rec.lang = lang().voice; rec.interimResults = true; rec.maxAlternatives = 1;
  let final = "";
  rec.onresult = e => { let t=""; for(const r of e.results){ t += r[0].transcript; } final=t; onText(t); };
  rec.onerror = () => {};
  rec.onend = () => { rec=null; onEnd && onEnd(true, final); };
  try{ rec.start(); }catch(e){ onEnd && onEnd(false); }
}

/* ---------- Leçon ---------- */
function buildEx(type,p,ph){
  const [tg,fr]=p;
  if(type==="choice") return {type,tg,fr,opts:shuffle([tg,...pick(pool().map(x=>x[0]).filter(x=>x!==tg),3)])};
  if(type==="listen") return {type,tg,fr,opts:shuffle([fr,...pick(pool().map(x=>x[1]).filter(x=>x!==fr),3)])};
  if(type==="build"){ const w=words(tg); const extra=pick(pool().flatMap(x=>words(x[0])).filter(x=>!w.map(norm).includes(norm(x))),2); return {type,tg,fr,bank:shuffle([...w,...extra])}; }
  if(type==="speak"||type==="dictation") return {type,tg,fr};
  if(type==="match"){ const pr=pick(ph,4); return {type,pairs:pr,left:shuffle(pr.map(x=>x[0])),right:shuffle(pr.map(x=>x[1]))}; }
}
const ORDERS = [
  ["choice","listen","speak","build","match","choice","build","speak"],        // 1re leçon : découverte
  ["listen","build","speak","dictation","match","choice","speak","build"],     // 2e leçon : pratique
  ["speak","dictation","build","listen","match","speak","build","choice"]      // révision de l'unité
];
function startLesson(u,l,skipTip){
  const unit=lang().units[u];
  if(l===0 && unit.tip && !skipTip && !S.tips[S.lang+u]) return openTip(u,"lesson");
  const half = Math.ceil(unit.p.length/2);
  const ph = l===0 ? unit.p.slice(0,half) : l===1 ? unit.p.slice(half) : unit.p.slice();
  const seq = shuffle(ph);
  beginLesson({u,l,queue:ORDERS[l].map((t,k)=>buildEx(t,seq[k%seq.length],ph))});
}
// Révision espacée : jusqu'à 10 phrases arrivées à échéance, exercices variés.
function startReview(){
  const due = srsDue().slice(0,10); if(!due.length) return;
  const types = ["listen","build","speak","dictation","choice"];
  beginLesson({u:-1,l:-1,review:true,queue:due.map((p,k)=>buildEx(types[k%types.length],p,due))});
}
function beginLesson(o){
  L = Object.assign(o,{i:0,right:0,tries:0,retry:new Set(),failed:new Set(),start:Date.now()});
  resetEx(); go("lesson");
  if(L.queue[0].type==="listen"||L.queue[0].type==="dictation") setTimeout(()=>say(L.queue[0].tg),300);
}
function ex(){ return L.queue[L.i]; }
function resetEx(){ Object.assign(L,{status:"idle",sel:null,built:[],matched:[],ml:null,mr:null,bad:null,heard:"",recOn:false,typed:"",miss:false}); }
function vLesson(){
  const e=ex(), pr=(L.i/L.queue.length)*100;
  let body="", canCheck=false, title="";
  const opts = arr => `<div class="grid">${arr.map((o,k)=>`<button class="choice ${L.sel===k?"on":""}" onclick="sel(${k})">${esc(o)}</button>`).join("")}</div>`;
  if(e.type==="choice"){
    title="Comment dit-on ?";
    body=`<div class="prompt">${waxi(72,"wow")}<div class="bubble">${esc(e.fr)}</div></div>${opts(e.opts)}`;
    canCheck=L.sel!==null;
  } else if(e.type==="listen"){
    title="Écoute et choisis la traduction";
    body=`<div style="display:flex;gap:14px;justify-content:center;align-items:center"><button class="speaker" onclick="say(ex().tg)" aria-label="Écouter">${I.spk}</button>
      <button class="speaker slow" onclick="say(ex().tg,.6)" aria-label="Écouter lentement">${I.turtle}</button></div>${opts(e.opts)}`;
    canCheck=L.sel!==null;
  } else if(e.type==="build"){
    title="Traduis cette phrase";
    body=`<div class="prompt">${waxi(72)}<div class="bubble">${esc(e.fr)}</div></div>
      <div class="answer">${L.built.map((k,j)=>`<button class="word pop" onclick="unbuild(${j})">${esc(e.bank[k])}</button>`).join("")}</div>
      <div class="bank">${e.bank.map((w,k)=>`<button class="word ${L.built.includes(k)?"used":""}" onclick="build(${k})">${esc(w)}</button>`).join("")}</div>`;
    canCheck=L.built.length>0;
  } else if(e.type==="dictation"){
    title="Dictée : écris ce que tu entends";
    body=`<div style="display:flex;gap:14px;justify-content:center;align-items:center"><button class="speaker" onclick="say(ex().tg)" aria-label="Écouter">${I.spk}</button>
      <button class="speaker slow" onclick="say(ex().tg,.6)" aria-label="Écouter lentement">${I.turtle}</button></div>
      <input class="type" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(L.typed)}" placeholder="Écris en ${lang().name.split(" ")[0].toLowerCase()}…" ${L.status!=="idle"?"disabled":""}
        oninput="L.typed=this.value;document.getElementById('chk').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&this.value.trim())check()">
      ${L.status!=="idle"?`<div class="said">${wordHits(L.typed,e.tg).map(x=>`<span class="${x.ok?"ok":"ko"}">${esc(x.w)}</span>`).join(" ")}</div>`:`<p class="note" style="margin-top:10px">Indice : ${esc(e.fr)}</p>`}`;
    canCheck = !!L.typed.trim();
  } else if(e.type==="speak"){
    title="Dis cette phrase à voix haute";
    body=`<div class="card" style="margin-bottom:6px"><div style="display:flex;justify-content:center"><button class="speaker slow" style="margin:0 0 10px" onclick="say(ex().tg)" aria-label="Écouter">${I.spk}</button></div>
      <div class="target">${esc(e.tg)}</div><div class="sub">${esc(e.fr)}</div></div>
      ${SR ? `<button class="mic ${L.recOn?"rec":""}" onclick="speakEx()" aria-label="Parler">${I.mic}</button>
      <div class="heard">${L.recOn?"Je t'écoute…":L.heard&&L.status!=="idle"?`<div class="said">${wordHits(L.heard,e.tg).map(x=>`<span class="${x.ok?"ok":"ko"}">${esc(x.w)}</span>`).join(" ")}</div><small>J'ai entendu : « ${esc(L.heard)} »</small>`:L.heard?`J'ai entendu : « ${esc(L.heard)} »`:"Appuie sur le micro et parle"}</div>`
      : `<p class="note" style="margin:16px 0 8px">Ton navigateur ne gère pas la reconnaissance vocale (essaie Chrome sur Android ou ordinateur). Écris la phrase :</p>
      <input class="type" id="typed" autocomplete="off" value="${esc(L.typed)}" placeholder="Écris en ${lang().name.split(" ")[0].toLowerCase()}…" oninput="L.typed=this.value;document.getElementById('chk').disabled=!this.value.trim()">`}`;
    canCheck = !SR && !!L.typed.trim();
  } else if(e.type==="match"){
    title="Associe les paires";
    const col=(arr,side)=>arr.map((w,k)=>{
      const done=L.matched.includes(side==="l"?w:e.pairs.find(p=>p[1]===w)[0]);
      const on=(side==="l"?L.ml:L.mr)===k, bad=L.bad&&L.bad[side]===k;
      return `<button class="choice ${done?"done":""} ${on?"on":""} ${bad?"bad":""}" style="font-size:15px" onclick="mt('${side}',${k})">${esc(w)}</button>`;}).join("");
    body=`<div class="match"><div class="grid">${col(e.left,"l")}</div><div class="grid">${col(e.right,"r")}</div></div>`;
  }
  let foot="";
  if(L.status==="idle"){
    const skip = e.type==="speak" && SR ? `<button class="btn ghost" onclick="skipSpeak()">Je ne peux pas parler maintenant</button>` : "";
    foot = e.type==="match" ? "" : `<div class="foot">${skip}<button class="btn" id="chk" ${canCheck?"":"disabled"} onclick="check()">Vérifier</button></div>`;
  } else {
    const ok=L.status==="right";
    const sol = e.type==="listen" ? `${e.fr} (${e.tg})` : e.tg;
    const praise = ["Excellent !","Bien joué !","Parfait !"][L.i%3];
    foot = `<div class="foot ${L.status}"><div class="fb">${waxi(44,ok?"happy":"sad")}<div>${ok?praise:"Pas tout à fait."}${!ok&&sol?`<span>Réponse : ${esc(sol)}</span>`:""}</div></div>
      <button class="btn ${ok?"":"coral"}" onclick="next()">Continuer</button></div>`;
  }
  return `<div class="lhead"><button onclick="quitLesson()" aria-label="Quitter" style="color:var(--muted)">${I.x}</button><div class="bar"><i style="width:${pr}%"></i></div></div>
    <main><h2 class="ltitle">${title}</h2>${body}</main>${foot}`;
}
function sel(k){ if(L.status!=="idle") return; L.sel=k; if(ex().type==="choice") say(ex().opts[k]); render(); }
function build(k){ if(L.status!=="idle"||L.built.includes(k)) return; L.built.push(k); say(ex().bank[k]); render(); }
function unbuild(j){ if(L.status!=="idle") return; L.built.splice(j,1); render(); }
function mt(side,k){
  const e=ex(); if(L.status!=="idle") return;
  if(side==="l"){ L.ml=k; say(e.left[k]); } else L.mr=k;
  L.bad=null;
  if(L.ml!==null&&L.mr!==null){
    const lw=e.left[L.ml], rw=e.right[L.mr];
    if(e.pairs.some(p=>p[0]===lw&&p[1]===rw)){ L.matched.push(lw); L.ml=L.mr=null;
      if(L.matched.length===e.pairs.length){ L.tries++; if(!L.miss) L.right++; L.status="right"; e.pairs.forEach(p=>{ if(!(S.srs||{})[srsKey(p[0])]) srsMark(p[0],true); }); }
    } else { L.bad={l:L.ml,r:L.mr}; L.ml=L.mr=null; L.miss=true; }
  }
  render();
}
function speakEx(){
  if(L.recOn){ try{rec&&rec.stop();}catch(e){} return; }
  L.recOn=true; L.heard=""; render();
  listen(t=>{ L.heard=t; const h=document.querySelector(".heard"); if(h) h.textContent=`« ${t} »`; },
    (ok,final)=>{ L.recOn=false;
      if(!ok||!final){ render(); return; }
      L.heard=final; grade(similarity(final, ex().tg)>=0.7);
    });
}
function skipSpeak(){ L.status="right"; render(); }
function check(){
  const e=ex(); let ok=false;
  if(e.type==="choice") ok=e.opts[L.sel]===e.tg;
  if(e.type==="listen") ok=e.opts[L.sel]===e.fr;
  if(e.type==="build") ok=norm(L.built.map(k=>e.bank[k]).join(" "))===norm(e.tg);
  if(e.type==="speak") ok=similarity(L.typed, e.tg)>=0.8;
  if(e.type==="dictation") ok=similarity(L.typed, e.tg)>=0.85;
  grade(ok);
}
function grade(ok){
  const e=ex(); L.tries++;
  // Mémoire : une phrase ratée pendant la séance ne monte pas de niveau, même réussie ensuite.
  if(ok){ L.right++; L.status="right"; S.words[e.tg]=1; if(!L.failed.has(e.tg)) srsMark(e.tg,true); say(e.tg); }
  else { L.status="wrong"; L.failed.add(e.tg); srsMark(e.tg,false);
    if(!L.retry.has(L.i)){ L.retry.add(L.i); const c=JSON.parse(JSON.stringify(e)); if(c.opts) c.opts=shuffle(c.opts); if(c.bank) c.bank=shuffle(c.bank); L.queue.push(c); } }
  render();
}
function next(){ L.i++; if(L.i>=L.queue.length) return finishLesson(); resetEx(); render(); const e=ex(); if(e.type==="listen"||e.type==="dictation") setTimeout(()=>say(e.tg),250); if(e.type==="dictation") setTimeout(()=>{const i=document.getElementById("typed"); if(i) i.focus();},50); }
function quitLesson(){ if(confirm("Quitter la leçon ? Ta progression sera perdue.")){ try{speechSynthesis.cancel();}catch(e){} L=null; go("home"); } }
function finishLesson(){
  const acc = Math.round(100*L.right/Math.max(1,L.tries));
  const xp = 10 + (acc===100?5:0) + (L.l===2?5:0);
  if(!L.review) S.done[lid(L.u,L.l)]=1;
  addXp(xp);
  L.res={acc,xp,time:Math.round((Date.now()-L.start)/1000)};
  go("result");
}
function vResult(){
  const r=L.res, m=Math.floor(r.time/60), s=String(r.time%60).padStart(2,"0"), st=streakAlive();
  return `<main class="center">${waxi(150,"happy")}
    <h1 class="display" style="font-size:32px">${L.review?"Révision terminée !":"Leçon terminée !"}</h1>
    <p class="note">${r.acc===100?"Sans faute. Tu parles déjà comme un pro.":"Chaque erreur te rapproche de la fluidité."}</p>
    <div class="stats">
      <div class="stat" style="border-color:var(--sun);color:var(--sun-d)"><small>XP</small><b>+${r.xp}</b></div>
      <div class="stat" style="border-color:var(--teal);color:var(--teal)"><small>PRÉCISION</small><b>${r.acc}%</b></div>
      <div class="stat" style="border-color:var(--coral);color:var(--coral)"><small>TEMPS</small><b>${m}:${s}</b></div></div>
    <div class="card" style="width:100%;display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;display:inline-flex">${I.flame}</span><b>Série : ${st} jour${st>1?"s":""}</b></div>
  </main><div class="foot"><button class="btn" onclick="L=null;go('home')">Continuer</button></div>`;
}

/* ---------- Parler (conversations guidées) ---------- */
function vTalk(){
  return topbar()+`<main>
    <div class="hello">${waxi(68,"wow")}<div class="bubble">Choisis une situation et réponds à voix haute.</div></div>
    <div class="stack">${lang().chats.map((c,k)=>`
      <button class="opt" onclick="startChat(${k})">
        <span class="tag" style="background:${k%2?"var(--teal)":"var(--coral)"}">${I.chatW}</span>
        <span style="flex:1"><b>${c.t}</b><small>${c.s.length} répliques${S.chats[S.lang+k]?" · terminée":""}</small></span></button>`).join("")}</div>
    <p class="note" style="margin-top:18px">Astuce : appuie sur un message pour l'écouter, ou sur « Traduire » si tu bloques.</p>
  </main>`+navbar("talk");
}
function startChat(k){ C={k,step:0,log:[],tr:{},recOn:false,heard:"",end:false}; pushBot(); go("chat"); }
function pushBot(){ const st=lang().chats[C.k].s[C.step]; C.log.push({who:"bot",t:st[0],fr:st[1]}); setTimeout(()=>say(st[0]),300); }
function vChat(){
  const ch=lang().chats[C.k], st=ch.s[C.step];
  const log=C.log.map((m,i)=> m.who==="bot"
    ? `<div class="msg bot pop"><span onclick="say(C.log[${i}].t)">${esc(m.t)}</span>${C.tr[i]?`<span class="tr">${esc(m.fr)}</span>`:""}
       <div class="act"><button onclick="say(C.log[${i}].t)">Écouter</button><button onclick="C.tr[${i}]=!C.tr[${i}];render()">${C.tr[i]?"Masquer":"Traduire"}</button></div></div>`
    : `<div class="msg me pop">${esc(m.t)}</div>`).join("");
  const reply = C.end
    ? `<div class="foot right"><div class="fb">${waxi(44)}<div>Conversation terminée !<span>+10 XP</span></div></div><button class="btn" onclick="C=null;go('talk')">Terminer</button></div>`
    : `<div class="reply"><div class="card">
        <div style="flex:1"><small class="note">À toi de répondre :</small><div style="font-weight:700;font-size:17px">${esc(st[2])}</div><small class="note">${esc(st[3])}</small>
        ${C.heard?`<div class="note" style="color:var(--coral)">${C.recOn?"":"Essaie encore : "}« ${esc(C.heard)} »</div>`:C.recOn?`<div class="note" style="color:var(--coral)">Je t'écoute…</div>`:""}</div>
        ${SR?`<button class="mini-mic ${C.recOn?"rec":""}" onclick="chatSpeak()" aria-label="Parler">${I.mic}</button>`:""}
      </div><button class="btn ghost" onclick="chatSend()">${SR?"Envoyer sans parler":"Envoyer la réponse"}</button></div>`;
  return `<div class="lhead"><button onclick="C=null;go('talk')" style="color:var(--muted)" aria-label="Fermer">${I.x}</button><b style="flex:1">${ch.t}</b>${waxi(36)}</div>
    <main style="padding-bottom:230px"><div class="chat">${log}</div></main>${reply}`;
}
function chatSpeak(){
  if(C.recOn){ try{rec&&rec.stop();}catch(e){} return; }
  C.recOn=true; C.heard=""; render();
  listen(t=>{C.heard=t;}, (ok,final)=>{ if(!C) return; C.recOn=false; C.heard=final||"";
    const st=lang().chats[C.k].s[C.step];
    if(final && similarity(final,st[2])>=0.6){ C.heard=""; chatSend(true); } else render(); });
}
function chatSend(spoken){
  const ch=lang().chats[C.k], st=ch.s[C.step];
  C.log.push({who:"me",t:st[2]}); C.heard=""; if(spoken) addXp(1);
  C.step++;
  if(C.step>=ch.s.length){ C.end=true; S.chats[S.lang+C.k]=1; addXp(10); render(); scrollEnd(); return; }
  render(); scrollEnd();
  setTimeout(()=>{ if(view==="chat"&&C&&!C.end){ pushBot(); render(); scrollEnd(); } },900);
}
function scrollEnd(){ window.scrollTo(0, document.body.scrollHeight); }

/* ---------- Arcade ---------- */
function vArcade(){
  if(!A||A.over) return topbar()+`<main class="center" style="padding-top:20px">
    ${waxi(120,"wow")}<h1 class="display" style="font-size:28px">Course aux mots</h1>
    <p class="note">40 secondes pour trouver un maximum de traductions. Trois bonnes réponses d'affilée et chaque point compte double.</p>
    ${A&&A.over?`<div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat" style="border-color:var(--teal);color:var(--teal)"><small>SCORE</small><b>${A.score}</b></div><div class="stat" style="border-color:var(--sun);color:var(--sun-d)"><small>RECORD</small><b>${S.best}</b></div></div>`:`<span class="chip">Record : ${S.best}</span>`}
    <div style="width:100%"><button class="btn sun" onclick="startArcade()">${A&&A.over?"Rejouer":"Jouer"}</button></div></main>`+navbar("arcade");
  const q=A.q;
  return `<div class="lhead"><button onclick="endArcade()" style="color:var(--muted)" aria-label="Arrêter">${I.x}</button><div class="spacer"></div>${A.combo>=3?`<span class="combo">x2</span>`:""}<span class="chip">${I.bolt}${A.score}</span></div>
    <main><div class="timer"><i style="width:${A.left/40*100}%"></i></div>
    <div class="big display">${esc(q.tg)}</div>
    <div class="grid">${q.opts.map((o,k)=>`<button class="choice ${A.bad===k?"bad":""}" onclick="arcPick(${k})">${esc(o)}</button>`).join("")}</div>
    <p class="note" style="text-align:center;margin-top:18px">${A.left} s</p></main>`;
}
// L'arcade n'utilise que les unités déjà ouvertes (2 au minimum) pour rester à ton niveau.
function arcPool(){ const us=lang().units; let n=us.findIndex((u,i)=>!unlocked(i,0)); if(n<0) n=us.length; return us.slice(0,Math.max(2,n)).flatMap(u=>u.p); }
function arcQ(prev){ const all=arcPool(), p=all.filter(x=>!prev||x[0]!==prev), x=p[Math.floor(Math.random()*p.length)]; return {tg:x[0],fr:x[1],opts:shuffle([x[1],...pick(all.map(y=>y[1]).filter(y=>y!==x[1]),3)])}; }
function startArcade(){
  A={score:0,combo:0,left:40,q:arcQ(),bad:null,over:false};
  A.timer=setInterval(()=>{ if(!A) return; A.left--; if(A.left<=0) endArcade(); else render(); },1000);
  render();
}
function arcPick(k){
  if(!A||A.over) return;
  if(A.q.opts[k]===A.q.fr){ A.combo++; A.score+=A.combo>=3?2:1; A.bad=null; A.q=arcQ(A.q.tg); }
  else { A.combo=0; A.bad=k; }
  render();
}
function endArcade(){ if(!A) return; clearInterval(A.timer); A.timer=null; A.over=true; if(A.score>S.best) S.best=A.score; if(A.score>0) addXp(Math.min(15,Math.ceil(A.score/2))); save(); render(); }

/* ---------- Profil ---------- */
function vProfile(){
  const total=lang().units.length*3, done=Object.keys(S.done).filter(k=>k.startsWith(S.lang+"-")).length;
  return topbar()+`<main>
    <div class="card" style="display:flex;align-items:center;gap:14px">${waxi(64)}<div><h2 style="font-size:22px">Mon profil</h2><div class="note">J'apprends : ${lang().name}</div></div></div>
    <h3 class="sec-t">Statistiques</h3>
    <div class="stats">
      <div class="stat" style="border-color:var(--coral);color:var(--coral)"><small>SÉRIE</small><b>${streakAlive()}</b></div>
      <div class="stat" style="border-color:var(--sun);color:var(--sun-d)"><small>XP</small><b>${S.xp}</b></div>
      <div class="stat" style="border-color:var(--teal);color:var(--teal)"><small>LEÇONS</small><b>${done}/${total}</b></div></div>
    <p class="note" style="margin-top:10px">${srsCount()} phrases en mémoire · ${srsDue().length} à réviser aujourd'hui</p>
    <h3 class="sec-t">Réglages</h3>
    <div class="card">
      <div class="row"><b>Langue</b><select class="sel" onchange="S.lang=this.value;save();render()">${Object.entries(LANGS).map(([k,l])=>`<option value="${k}" ${S.lang===k?"selected":""}>${l.name}</option>`).join("")}</select></div>
      <div class="row"><b>Objectif</b><select class="sel" onchange="S.goal=+this.value;save();render()">${GOALS.map(([x,n])=>`<option value="${x}" ${S.goal===x?"selected":""}>${n} · ${x} XP</option>`).join("")}</select></div>
      <div class="row"><b>Son</b><span class="note">Voix Waxi enregistrée</span><button class="chip" onclick="testSound()">Tester</button></div>
      <div class="row"><b>Micro</b><span class="note">${SR?"Disponible":"Non pris en charge ici"}</span></div>
    </div>
    <button class="btn ghost" style="margin-top:14px" onclick="if(confirm('Effacer toute ta progression ?')){S=fresh();save();ob={step:0,lang:null,goal:20};go('ob')}">Réinitialiser la progression</button>
  </main>`+navbar("profile");
}

try{ speechSynthesis.getVoices(); }catch(e){}
render();
</script>
